<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0c10">
    <meta name="color-scheme" content="dark">
    <title>Sign in · Sentinel</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=11">
    <script src="/login.js?v=7" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"></circle><circle cx="16" cy="16" r="5"></circle><path d="M16 4v7M16 21v7M4 16h7M21 16h7"></path></svg>
          </span>
          <span><strong>Sentinel</strong><small>Protected device access</small></span>
        </div>

        <div class="login-heading">
          <p class="eyebrow">Authentication required</p>
          <h1 id="login-title">Sign in</h1>
        </div>

        <form id="login-form" class="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" value="admin" maxlength="64" autocomplete="username" required autofocus>
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" maxlength="1024" autocomplete="current-password" required>
            <button id="show-password" class="field-icon-button" type="button" aria-label="Show password" title="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
          <button id="login-button" class="button login-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"></path></svg>
            <span>Sign in</span>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
